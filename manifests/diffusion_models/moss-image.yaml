id: moss-image
name: "MOSS-Image"
type: diffusion_model
architecture: moss_image
author: OpenMOSS / Comfy-Org
license: apache-2.0
homepage: https://huggingface.co/OpenMOSS-Team/MOSS-Image-SFT
description: |
  MOSS-Image SFT — OpenMOSS's 5B single-stream DiT conditioned on the final
  hidden state of Qwen3.5-9B, decoded by the FLUX.2 small-decoder VAE.
  Aesthetic-tuned: clean, polished look, very strong prompt adherence and
  text rendering. Upstream defaults: 50 steps, CFG 3, Euler (shift 5), DiT
  block 22 skipped in the negative branch. Apache-2.0.
  Single file is the Comfy-Org repackage (attention q/k/v fused into
  proj.qkv; split back at load time by the modl worker).

variants:
  - id: bf16
    file: moss_image_sft_bf16.safetensors
    url: https://huggingface.co/Comfy-Org/MOSS-Image/resolve/main/diffusion_models/moss_image_sft_bf16.safetensors
    sha256: "f96738d8116d78b7316b57c663d8c98591ddafab7488f48e3099b7655e34ab6f"
    size: 10164655808
    format: safetensors
    precision: bf16
    vram_required: 20480
    vram_recommended: 24576
    note: "bf16 — the 19GB text encoder is swapped in only for the prompt encode."

requires:
  - id: moss-qwen3.5-9b-text-encoder
    type: text_encoder
    reason: "Qwen3.5 9B text encoder (final hidden state) for prompt conditioning"
  - id: flux2-vae-small
    type: vae
    reason: "FLUX.2 VAE with the small decoder, used by MOSS-Image"

defaults:
  steps: 50
  cfg: 3.0
  sampler: euler
  scheduler: flowmatch

tags: [moss, text-to-image, dit, photographic, text-rendering]

rating: 4.7
downloads: 0
added: "2026-11-17"
updated: "2026-11-17"
