description: |
  Data-space DMD distillation of MOSS-Image Base (50 steps, CFG 3) down to
  8 steps without CFG, packaged as a rank-128 fp32 LoRA on every block's
  attention and FFN projections. Use with the stock sampler at CFG 1 and
  4–8 steps (8 is noticeably sharper). The delta is smaller than bf16's
  rounding step, so it must be applied unmerged — modl does this
  automatically. Wired to `--fast` / workflow `fast:` on moss-image-base.
  Work-in-progress checkpoint (update 12000, EMA); hash-pinned.

